name: jsmedicine-test

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jsmedicine-test-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-jsmedicine_test}
      DB_USERNAME: ${DB_USERNAME:-jsmedicine}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_SSL: ${REDIS_SSL:-false}
      AUTH_BOOTSTRAP_USERNAME: ${AUTH_BOOTSTRAP_USERNAME:-superadmin}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      AUTH_BOOTSTRAP_REAL_NAME: ${AUTH_BOOTSTRAP_REAL_NAME:-系统超级管理员}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-7200}
      APP_USER_AUTH_TOKEN_TTL_SECONDS: ${APP_USER_AUTH_TOKEN_TTL_SECONDS:-7200}
      APP_USER_AUTH_SMS_CODE_TTL_SECONDS: ${APP_USER_AUTH_SMS_CODE_TTL_SECONDS:-300}
      APP_USER_AUTH_SMS_MOCK_ENABLED: ${APP_USER_AUTH_SMS_MOCK_ENABLED:-true}
      APP_USER_AUTH_SMS_MOCK_CODE: ${APP_USER_AUTH_SMS_MOCK_CODE:-123456}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_REGION_ID: ${ALIYUN_SMS_REGION_ID:-ap-southeast-1}
      ALIYUN_SMS_ENDPOINT: ${ALIYUN_SMS_ENDPOINT:-dypnsapi.aliyuncs.com}
      WECHAT_MINIAPP_MOCK_ENABLED: ${WECHAT_MINIAPP_MOCK_ENABLED:-false}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID:-}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET:-}
      APP_STORAGE_PROVIDER: ${APP_STORAGE_PROVIDER:-minio}
      APP_STORAGE_ENDPOINT: ${APP_STORAGE_ENDPOINT:-http://minio:9000}
      APP_STORAGE_ACCESS_KEY: ${APP_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      APP_STORAGE_SECRET_KEY: ${APP_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin123}}
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_STORAGE_PUBLIC_BASE_URL:-}
      APP_STORAGE_PRESIGNED_UPLOAD_BASE_URL: ${APP_STORAGE_PRESIGNED_UPLOAD_BASE_URL:-}
      APP_STORAGE_AUTO_CREATE_BUCKET: ${APP_STORAGE_AUTO_CREATE_BUCKET:-true}
      APP_STORAGE_AVATAR_BUCKET_NAME: ${APP_STORAGE_AVATAR_BUCKET_NAME:-public}
      APP_STORAGE_AVATAR_MAX_FILE_SIZE_BYTES: ${APP_STORAGE_AVATAR_MAX_FILE_SIZE_BYTES:-5242880}
      APP_STORAGE_AVATAR_UPLOAD_URL_TTL_SECONDS: ${APP_STORAGE_AVATAR_UPLOAD_URL_TTL_SECONDS:-900}
      TEST_BASE_URL: ${TEST_BASE_URL:-https://api-test.example.com}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-}
      APP_CORS_ALLOWED_METHODS: ${APP_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_CORS_ALLOWED_HEADERS: ${APP_CORS_ALLOWED_HEADERS:-*}
      APP_CORS_EXPOSED_HEADERS: ${APP_CORS_EXPOSED_HEADERS:-Authorization,Content-Disposition}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS:-true}
      APP_CORS_MAX_AGE: ${APP_CORS_MAX_AGE:-3600}
      APP_LIVE_ENABLED: ${APP_LIVE_ENABLED:-true}
      APP_LIVE_MEDIA_HOST: ${APP_LIVE_MEDIA_HOST:-127.0.0.1}
      APP_LIVE_PUBLISH_HOST: ${APP_LIVE_PUBLISH_HOST:-}
      APP_LIVE_PLAYBACK_HOST: ${APP_LIVE_PLAYBACK_HOST:-}
      APP_LIVE_PLAYBACK_BASE_URL: ${APP_LIVE_PLAYBACK_BASE_URL:-}
      APP_LIVE_PLAYBACK_SCHEME: ${APP_LIVE_PLAYBACK_SCHEME:-http}
      APP_LIVE_RTMP_PORT: ${APP_LIVE_RTMP_PORT:-1935}
      APP_LIVE_HTTP_PORT: ${APP_LIVE_HTTP_PORT:-8080}
      APP_LIVE_APP_NAME: ${APP_LIVE_APP_NAME:-live}
      APP_LIVE_CALLBACK_BASE_URL: ${APP_LIVE_CALLBACK_BASE_URL:-http://127.0.0.1:8080}
      APP_LIVE_CALLBACK_PATH: ${APP_LIVE_CALLBACK_PATH:-/api/v1/integrations/srs/live-hooks}
      APP_LIVE_CALLBACK_TOKEN: ${APP_LIVE_CALLBACK_TOKEN:-}
      JAVA_OPTS: "${JAVA_OPTS:--Xms256m -Xmx512m}"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_BIND_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  mysql:
    image: mysql:8.4
    container_name: jsmedicine-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_NAME:-jsmedicine_test}
      MYSQL_USER: ${DB_USERNAME:-jsmedicine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --mysql-native-password=ON
      - --max_connections=${MYSQL_MAX_CONNECTIONS:-80}
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-268435456}
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: jsmedicine-test-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-change_me}
      --maxmemory ${REDIS_MAX_MEMORY:-128mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change_me} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: jsmedicine-test-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio_test_data:/data
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  srs:
    image: ${SRS_IMAGE:-ossrs/srs:5}
    container_name: jsmedicine-test-srs
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_LIVE_APP_NAME: ${APP_LIVE_APP_NAME:-live}
      APP_LIVE_CALLBACK_TOKEN: ${APP_LIVE_CALLBACK_TOKEN:-}
      SRS_CALLBACK_BASE_URL: ${SRS_CALLBACK_BASE_URL:-http://app:8080/api/v1/integrations/srs/live-hooks}
    command: ["sh", "/usr/local/srs/conf/start-srs.sh"]
    volumes:
      - ./docker/srs/srs.template.conf:/usr/local/srs/conf/docker-live.template.conf:ro
      - ./docker/srs/start-srs.sh:/usr/local/srs/conf/start-srs.sh:ro
      - srs_test_data:/usr/local/srs/objs/nginx/html
    ports:
      - "${SRS_RTMP_BIND_HOST:-0.0.0.0}:${APP_LIVE_RTMP_PORT:-1935}:1935"
      - "${SRS_API_BIND_HOST:-127.0.0.1}:${SRS_API_PORT:-1985}:1985"
      - "${SRS_HTTP_BIND_HOST:-0.0.0.0}:${APP_LIVE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1985/api/v1/versions || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_test_data:
  redis_test_data:
  minio_test_data:
  srs_test_data:
