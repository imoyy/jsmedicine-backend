spring:
  application:
    name: jsmedicine
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.test[.properties]
  profiles:
    active: dev
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:jsmedicine}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          username: ${DB_USERNAME:jsmedicine}
          password: ${DB_PASSWORD:jsmedicine123}
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123456}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.gugugaga.jsmedicine: INFO

app:
  auth:
    token-ttl-seconds: ${AUTH_TOKEN_TTL_SECONDS:7200}
    token-prefix: ${AUTH_TOKEN_PREFIX:admin:token:}
    bootstrap-username: ${AUTH_BOOTSTRAP_USERNAME:superadmin}
    bootstrap-password: ${AUTH_BOOTSTRAP_PASSWORD:}
    bootstrap-real-name: ${AUTH_BOOTSTRAP_REAL_NAME:系统超级管理员}
  user-auth:
    token-ttl-seconds: ${APP_USER_AUTH_TOKEN_TTL_SECONDS:7200}
    token-prefix: ${APP_USER_AUTH_TOKEN_PREFIX:app:user:token:}
    sms:
      code-ttl-seconds: ${APP_USER_AUTH_SMS_CODE_TTL_SECONDS:300}
      code-prefix: ${APP_USER_AUTH_SMS_CODE_PREFIX:app:user:sms:}
      mock-enabled: ${APP_USER_AUTH_SMS_MOCK_ENABLED:false}
      mock-code: ${APP_USER_AUTH_SMS_MOCK_CODE:}
      aliyun:
        access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
        access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
        region-id: ${ALIYUN_SMS_REGION_ID:ap-southeast-1}
        endpoint: ${ALIYUN_SMS_ENDPOINT:dypnsapi.aliyuncs.com}
        sign-name: ${ALIYUN_SMS_SIGN_NAME:}
        template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    wechat:
      app-id: ${WECHAT_MINIAPP_APP_ID:}
      app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
      mock-enabled: ${WECHAT_MINIAPP_MOCK_ENABLED:false}
    wechat-web:
      app-id: ${WECHAT_WEB_APP_ID:}
      app-secret: ${WECHAT_WEB_APP_SECRET:}
      redirect-uri: ${WECHAT_WEB_REDIRECT_URI:}
      scope: ${WECHAT_WEB_SCOPE:snsapi_login}
      mock-enabled: ${WECHAT_WEB_MOCK_ENABLED:true}
      state-ttl-seconds: ${WECHAT_WEB_STATE_TTL_SECONDS:600}
      bind-token-ttl-seconds: ${WECHAT_WEB_BIND_TOKEN_TTL_SECONDS:600}
  storage:
    provider: ${APP_STORAGE_PROVIDER:minio}
    endpoint: ${APP_STORAGE_ENDPOINT:http://127.0.0.1:${MINIO_PORT:9000}}
    access-key: ${APP_STORAGE_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
    secret-key: ${APP_STORAGE_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin123}}
    public-base-url: ${APP_STORAGE_PUBLIC_BASE_URL:}
    presigned-upload-base-url: ${APP_STORAGE_PRESIGNED_UPLOAD_BASE_URL:}
    auto-create-bucket: ${APP_STORAGE_AUTO_CREATE_BUCKET:true}
    avatar:
      bucket-name: ${APP_STORAGE_AVATAR_BUCKET_NAME:public}
      object-prefix: ${APP_STORAGE_AVATAR_OBJECT_PREFIX:app-users}
      max-file-size-bytes: ${APP_STORAGE_AVATAR_MAX_FILE_SIZE_BYTES:5242880}
      upload-url-ttl-seconds: ${APP_STORAGE_AVATAR_UPLOAD_URL_TTL_SECONDS:900}
      allowed-content-types: ${APP_STORAGE_AVATAR_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    cover:
      bucket-name: ${APP_STORAGE_COVER_BUCKET_NAME:public}
      object-prefix: ${APP_STORAGE_COVER_OBJECT_PREFIX:admin/covers}
      max-file-size-bytes: ${APP_STORAGE_COVER_MAX_FILE_SIZE_BYTES:5242880}
      upload-url-ttl-seconds: ${APP_STORAGE_COVER_UPLOAD_URL_TTL_SECONDS:900}
      allowed-content-types: ${APP_STORAGE_COVER_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
