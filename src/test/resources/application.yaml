spring:
  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          url: jdbc:h2:mem:jsmedicine;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
          username: sa
          password:
          driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      repositories:
        enabled: false
  flyway:
    enabled: false

logging:
  level:
    root: WARN
