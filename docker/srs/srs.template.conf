listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      __CALLBACK_URL__;
        on_unpublish    __CALLBACK_URL__;
    }

    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_mount       [vhost]/[app]/[stream].m3u8;
        hls_fragment    10;
        hls_window      60;
    }
}
